name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: test
        run: go vet ./... && go test ./...

      # Only macOS binaries are released; Linux is not supported yet
      # (see TODO.md Phase 6).
      - name: build
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/osamu/localapp/internal/config.Version=${VERSION}"
          mkdir -p dist
          for arch in arm64 amd64; do
            out="localapp_${VERSION}_darwin_${arch}"
            GOOS=darwin GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${out}/localapp" ./cmd/localapp
            cp LICENSE README.md "dist/${out}/"
            tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
